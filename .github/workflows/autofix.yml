name: CI + AI Autofix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-autofix:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        id: run_tests
        shell: bash
        run: |
          set -o pipefail
          pytest test_todo.py -v --tb=short 2>&1 | tee test_output.txt
        continue-on-error: true

      - name: AI Autofix
        if: steps.run_tests.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 autofix.py

      - name: Commit and push fix
        if: steps.run_tests.outcome == 'failure'
        run: |
          git config user.name  "AI Autofix Bot"
          git config user.email "autofix@github-actions"
          git add todo.py
          git commit -m "fix: AI autofix — bug detected and removed automatically"
          git push origin main
